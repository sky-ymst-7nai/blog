<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学習用 Webプロキシ</title>
<style>
  body { font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.7; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .6rem; font-size: 1rem; }
  button { padding: .6rem 1.2rem; font-size: 1rem; }
  ul { padding-left: 1.2rem; }
  small { color: #666; }
</style>
</head>
<body>
  <h1>学習用 Webプロキシ</h1>
  <form action="/go" method="get">
    <input type="text" name="url" placeholder="https://note.com/login" autofocus>
    <button type="submit">開く</button>
  </form>
  <h2>クイックリンク</h2>
  <ul>
    <li><a href="/go?url=https://note.com/login">note（ログイン）</a></li>
    <li><a href="/go?url=https://www.ameba.jp/">Ameba</a></li>
    <li><a href="/go?url=https://fc2.com/">FC2</a></li>
    <li><a href="/go?url=https://www.hatena.ne.jp/login">はてな（ログイン）</a></li>
  </ul>
  <p><a href="/__px/reset">保存済みCookie（ログイン状態）を消去</a></p>
  <p><small>自分のアカウントでの学習・動作確認用です。各サービスの利用規約を守ってください。</small></p>
</body>
</html>
